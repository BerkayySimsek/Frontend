  // Kullanıcıdan ürün ismi , fiyat ve miktar değerini alalım
  // toplam ürün fiyatı : 2000'den fazla ise %20 indirim uygulasın
  // toplam ürün fiyatı : 1000'den fazla ise %10 indirim uygulasın
  // toplam ücret , indirim oranı , indirimli fiyatı , indirimsiz olan fiyattan indirimli fiyat farkını gösteriniz.

  const productName = prompt("Lütfen ürün ismini giriniz: ")
  const productPrice = Number(prompt("Lütfen ürün fiyatını giriniz: "))
  const productCount = Number(prompt("Lütfen ürün miktarını giriniz: "))

  let indirimOrani = 0
  let indirimliFiyat = 0
  let indirimFarki = 0

  const totalPrice = productPrice * productCount + productName
  if (totalPrice>=1000 && totalPrice<2000)
  {
    indirimOrani = 10
  }
  else if (totalPrice>=2000)
  {
    indirimOrani = 20
  }
  indirimliFiyat = totalPrice - (totalPrice * (indirimOrani / 100))
  indirimFarki=totalPrice-indirimliFiyat


  const message = `Ürün adı : ${productName} \n İndirim Oranı : ${indirimOrani} \n İndirimli Fiyat : ${indirimliFiyat} \n İndirim Farkı : ${indirimFarki} \n Toplam Ücret : ${totalPrice}`
  alert(message)
