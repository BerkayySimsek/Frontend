<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Programlama Dilleri Tanıtım Sitesi</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<div class="container">
    <div class="row">
        <div class="col">
            <div class="card" style="width: 18rem;">
                <img src="assets/csharp.jpg" class="card-img-top" alt="C# logo" width="150" height="150">
                <div class="card-body">
                    <h5 class="card-title">C# Programlama Dili</h5>
                    <p class="card-text">C# programlama dili çok güzel bir dildir.</p>
                    <a href="https://learn.microsoft.com/tr-tr/dotnet/csharp/" class="btn btn-outline-primary" target="_blank">Detaya Git <i class="bi bi-box-arrow-up-right"></i></a>
                </div>
            </div>
        </div>
        <div class="col">
            <div class="card" style="width: 18rem;">
                <img src="assets/python.png" class="card-img-top" alt="Python logo" width="150" height="150">
                <div class="card-body">
                    <h5 class="card-title">Python Programlama Dili</h5>
                    <p class="card-text">Python programlama dili çok güzel bir dildir.</p>
                    <a href="https://www.python.org/" class="btn btn-outline-primary" target="_blank">Detaya Git <i class="bi bi-box-arrow-up-right"></i></a>
                </div>
            </div>
        </div>
        <div class="col">
            <div class="card" style="width: 18rem;">
                <img src="assets/javascript.png" class="card-img-top" alt="JavaScript logo" width="150" height="150">
                <div class="card-body">
                    <h5 class="card-title">Javascript</h5>
                    <p class="card-text">Javascript programlama dili çok güzel bir dildir.</p>
                    <a href="https://www.javascript.com/" class="btn btn-outline-primary" target="_blank">Detaya Git <i class="bi bi-box-arrow-up-right"></i></a>
                </div>
            </div>
        </div>
    </div>
    <div id="carouselExampleIndicators" class="carousel slide">
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1" aria-label="Slide 2"></button>
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2" aria-label="Slide 3"></button>
        </div>
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="assets/csharp.jpg" class="d-block w-100" alt="..." style="width: 400px; height: 300px;">
            </div>
            <div class="carousel-item">
                <img src="assets/python.png" class="d-block w-100" alt="..." style="height: 400px; height: 300px;">
            </div>
            <div class="carousel-item">
                <img src="assets/javascript.png" class="d-block w-100" alt="..." style="height: 400px; height: 300px;">
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
